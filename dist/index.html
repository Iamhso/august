  }

    border-radius:14px;width:100%;height:auto;touch-action:none;cursor:crosshair}
  aside{width:300px;flex-shrink:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:18px;display:flex;flex-direction:column;gap:16px}

  .group>label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  button{flex:1;background:#232a4a;color:var(--ink);border:1px solid var(--line);border-radius:9px;
    padding:10px;font-size:13px;cursor:pointer;transition:.15s}
  button:hover{background:#2c3358;border-color:var(--accent)}
  button.primary{background:var(--good);color:#08281a;border-color:var(--good);font-weight:700}
  button.primary:hover{filter:brightness(1.08)}
  .spawn{background:#232a4a;border:1.5px dashed var(--accent);border-radius:10px;padding:12px;text-align:center;
    font-size:13px;color:var(--accent);cursor:grab;user-select:none}
  .spawn:active{cursor:grabbing;transform:scale(.97)}
  .ghost{position:fixed;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#ff7ac6;
    box-shadow:0 0 16px #ff7ac6;pointer-events:none;z-index:999}
  .ink{height:12px;border-radius:6px;background:#232a4a;overflow:hidden;border:1px solid var(--line)}
  .ink>div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0%}
  .stat{font-size:13px;color:var(--muted)}
  .stat b{color:var(--ink)}
  label.chk{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
  .hint{font-size:12px;color:var(--muted);line-height:1.55}
  .foot{margin-top:auto;font-size:11px;color:#5b6392}
</style>
<script src="https://lounge.letscoding.kr/sdk/letscoding-ranking.js"></script>

    walls:[{x:2300,y:700,w:44,h:640}],

let li=0, L=LEVELS[0];
const BALL_R=12;

// ---------- 상태 ----------
let mode='edit';            // 'edit' | 'play' | 'win' | 'lose'
let curves=[];              // [{pts:[{x,y}*4]}]
let dragIdx=null;           // {c,i}
let showCtrl=true;
let ball={x:0,y:0,vx:0,vy:0,r:BALL_R,angle:0};
let rankingSubmitted=false;
let remainingInkScore=0, clearStreak=0, stageEdited=false;

function setRankingStatus(message){
  const element=document.getElementById('rankingStatus');
  if(element) element.textContent=message;
}
function submitRanking(score){
  if(rankingSubmitted) return;
  if(!window.LetscodingRanking){
    setRankingStatus('랭킹 SDK가 로드되지 않았습니다. 로컬 환경에서는 점수가 등록되지 않습니다.');
    return;
  }
  rankingSubmitted=true;
  setRankingStatus('랭킹 등록 중...');
  const safeScore=Math.max(0,Math.floor(score));
  LetscodingRanking.submitScore(safeScore)
    .then(()=>{
      setRankingStatus('등록 완료! 점수가 랭킹에 반영되었습니다.');
      setStatus('등록 완료! 점수가 랭킹에 반영되었습니다.','good');
    })
    .catch((error)=>{
      rankingSubmitted=false;
      setRankingStatus('랭킹 등록 실패: '+error.message);
    });
}
function resetScoreRun(){
  rankingSubmitted=false;
  remainingInkScore=0;
  clearStreak=0;
  stageEdited=false;
  setRankingStatus('');
  document.getElementById('scorestat').textContent='완주 시 계산됩니다.';
}
function markEdited(){
  stageEdited=true;
  clearStreak=0;
}
function finishStage(){
  remainingInkScore+=Math.max(0,L.inkMax-totalInk());
  if(stageEdited) clearStreak=0;
  else clearStreak++;
}
function scoreMultiplier(){ return 1+clearStreak*0.1; }
function finalScore(){
  return Math.max(0,Math.round(remainingInkScore*33*scoreMultiplier()));
}

// 카메라(확대/축소·이동) & 시간
let scale=1, camX=0, camY=0, tick=0;
let panning=false, panLast=null;
let hasKey=false;           // 열쇠 획득 여부

// ---------- 유틸: 3차 베지에 ----------
function bez(p,t){
  const u=1-t;
  const a=u*u*u, b=3*u*u*t, c=3*u*t*t, d=t*t*t;
  return { x:a*p[0].x+b*p[1].x+c*p[2].x+d*p[3].x,
           y:a*p[0].y+b*p[1].y+c*p[2].y+d*p[3].y };
}
function curveLen(p){
  let len=0, prev=bez(p,0);
  for(let i=1;i<=24;i++){ const q=bez(p,i/24); len+=Math.hypot(q.x-prev.x,q.y-prev.y); prev=q; }
  return len;
}
function totalInk(){ return curves.reduce((s,c)=>s+curveLen(c.pts),0); }

// ---------- 레벨 로드 ----------
function loadLevel(idx){
  li=idx; L=LEVELS[idx];
  curves = (L.seeds||[]).map(s=>({pts:s.map(p=>({x:p[0],y:p[1]}))}));
  fitView();                               // 레벨 전체가 보이도록 카메라 맞춤
  resetBall();
  mode='edit';
  document.getElementById('next').style.display='none';
  setStatus(`${idx+1}/${LEVELS.length} · ${L.name} — 곡선으로 다리를 놓으세요.`);
  refreshInk();
  updateWindSound();                       // 선풍기 맵이면 바람소리 시작/정지
}
function resetBall(){
  ball={x:L.start.x, y:L.start.y - BALL_R, vx:0, vy:0, r:BALL_R, angle:0};
  hasKey=false;
}

// ---------- 충돌 세그먼트 준비 ----------
let segs=[];
function buildSegs(){
  segs=[];
  // 지형(발판) 윗면
  for(const g of L.ledges){ segs.push([{x:g.x,y:g.y},{x:g.x+g.w,y:g.y}]); }
  // 고체 벽(네 면 모두 충돌)
  for(const wl of (L.walls||[])) pushRectSegs(segs, wl);
  // 플레이어 곡선
  for(const c of curves){
    let prev=bez(c.pts,0);
    const N=28;
    for(let i=1;i<=N;i++){ const q=bez(c.pts,i/N); segs.push([prev,q]); prev=q; }
  }
}

// ---------- 물리 ----------
const GRAV=0.5, REST=0.14, FRICT=0.0025, MAXSPD=34;
function pushRectSegs(arr,r){
  const x2=r.x+r.w, y2=r.y+r.h;
  arr.push([{x:r.x,y:r.y},{x:x2,y:r.y}]);   // 위
  arr.push([{x:r.x,y:y2},{x:x2,y:y2}]);     // 아래
  arr.push([{x:r.x,y:r.y},{x:r.x,y:y2}]);   // 왼쪽
  arr.push([{x:x2,y:r.y},{x:x2,y:y2}]);     // 오른쪽
}
// 움직이는 벽의 현재 사각형
function moverRect(m){
  const off=Math.sin(tick*m.speed+(m.phase||0))*m.amp;
  return m.axis==='x' ? {x:m.x+off,y:m.y,w:m.w,h:m.h} : {x:m.x,y:m.y+off,w:m.w,h:m.h};
}
// 점-선분 거리
function distPointSeg(p,a,b){
  const abx=b.x-a.x, aby=b.y-a.y, L2=abx*abx+aby*aby||1e-6;
  let t=((p.x-a.x)*abx+(p.y-a.y)*aby)/L2; t=Math.max(0,Math.min(1,t));
  return Math.hypot(p.x-(a.x+abx*t), p.y-(a.y+aby*t));
}
// 풍차 날개(현재 각도)의 선분들
function windmillBlades(wm){
  const base=tick*wm.speed+(wm.phase||0), out=[];
  for(let b=0;b<wm.blades;b++){
    const a=base+b*(Math.PI*2/wm.blades);
    out.push([{x:wm.x,y:wm.y},{x:wm.x+Math.cos(a)*wm.r, y:wm.y+Math.sin(a)*wm.r}]);
  }
  return out;
}
// 카메라를 레벨 전체가 보이도록 맞춤
function fitView(){
  const B=L.bounds, m=50;
  scale=Math.min(W/(B.w+m*2), H/(B.h+m*2), 1.4);
  camX=(W-B.w*scale)/2; camY=(H-B.h*scale)/2;
}
function resolve(a,b){
  const abx=b.x-a.x, aby=b.y-a.y;
  const L2=abx*abx+aby*aby || 1e-6;
  let t=((ball.x-a.x)*abx+(ball.y-a.y)*aby)/L2;
  t=Math.max(0,Math.min(1,t));
  const cx=a.x+abx*t, cy=a.y+aby*t;
  let dx=ball.x-cx, dy=ball.y-cy;
  let d=Math.hypot(dx,dy);
  if(d>=ball.r) return;
  if(d<1e-6){ dx=0; dy=-1; d=1; }
  const nx=dx/d, ny=dy/d, pen=ball.r-d;
  ball.x+=nx*pen; ball.y+=ny*pen;              // 밀어내기
  const vn=ball.vx*nx+ball.vy*ny;
  if(vn<0){                                     // 파고드는 속도만 반사
    if(-vn>IMPACT_SPD) impactHit=true;          // 일정 속도 이상 충돌 → 드롭 사운드
    ball.vx-=nx*vn*(1+REST);
    ball.vy-=ny*vn*(1+REST);
  }
  ball.vx*=(1-FRICT); ball.vy*=(1-FRICT);       // 마찰
}
// 선풍기: 바람 방향 단위벡터 & 바람 영역 판정
function fanDir(f){ const a=(f.angle||0)*Math.PI/180; return {x:Math.cos(a), y:Math.sin(a)}; }
function inFan(f){
  const d=fanDir(f), px=ball.x-f.x, py=ball.y-f.y;
  const u=px*d.x+py*d.y;                          // 바람 방향 거리
  const v=-px*d.y+py*d.x;                         // 수직(옆) 거리
  return u>=0 && u<=f.range && Math.abs(v)<=f.width/2;
}
// 풍차: 회전 속도(ω×반경)에만 비례해 튕겨냄 — 공의 속도와 무관
const WM_KICK=1.6;                                 // 표면 속도의 몇 배까지 밀지
function resolveWindmill(wm){
  const base=tick*wm.speed+(wm.phase||0), omega=wm.speed;
  const R=ball.r+(wm.thick||6);
  for(let bl=0;bl<wm.blades;bl++){
    const ang=base+bl*(Math.PI*2/wm.blades);
    const abx=Math.cos(ang)*wm.r, aby=Math.sin(ang)*wm.r, L2=abx*abx+aby*aby||1e-6;
    let t=((ball.x-wm.x)*abx+(ball.y-wm.y)*aby)/L2; t=Math.max(0,Math.min(1,t));
    const cx=wm.x+abx*t, cy=wm.y+aby*t;
    let dx=ball.x-cx, dy=ball.y-cy, d=Math.hypot(dx,dy);
    if(d>=R) continue;
    if(d<1e-6){ dx=Math.cos(ang+Math.PI/2); dy=Math.sin(ang+Math.PI/2); d=1; }
    const nx=dx/d, ny=dy/d, pen=R-d;
    ball.x+=nx*pen; ball.y+=ny*pen;                // 밀어내기(관통 방지)
    const vn=ball.vx*nx+ball.vy*ny;                // 파고드는 성분만 제거(공 속도 반발 없음)
    if(vn<0){ ball.vx-=nx*vn; ball.vy-=ny*vn; }
    // 접점의 회전 표면 속도 = ω × 반경  → 이 방향으로 표면속도의 WM_KICK배까지 끌어올림
    const rx=cx-wm.x, ry=cy-wm.y;
    const svx=-omega*ry, svy=omega*rx;
    const svl2=svx*svx+svy*svy||1e-6;
    const along=(ball.vx*svx+ball.vy*svy)/svl2;    // 공 속도의 표면방향 배수
    if(along<WM_KICK){ const add=WM_KICK-along; ball.vx+=svx*add; ball.vy+=svy*add; }
  }
}
function physicsStep(){
  impactHit=false;
  ball.vy+=GRAV;
  // 선풍기 바람: 영역 안이면 바라보는 방향으로 밀기
  for(const f of (L.fans||[])) if(inFan(f)){ const d=fanDir(f); ball.vx+=d.x*f.power; ball.vy+=d.y*f.power; }
  const sp=Math.hypot(ball.vx,ball.vy);          // 속도 제한(터널링 방지)
  if(sp>MAXSPD){ ball.vx*=MAXSPD/sp; ball.vy*=MAXSPD/sp; }
  // 움직이는 벽의 현재 충돌면
  const mSegs=[];
  for(const m of (L.movers||[])) pushRectSegs(mSegs, moverRect(m));
  const SUB=6;
  for(let s=0;s<SUB;s++){
    ball.x+=ball.vx/SUB; ball.y+=ball.vy/SUB;
    for(const seg of segs) resolve(seg[0],seg[1]);
    for(const seg of mSegs) resolve(seg[0],seg[1]);
    // 풍차 날개: 회전 속도에 비례해 공을 튕겨냄(공 속도와 무관)
    for(const wm of (L.windmills||[])) resolveWindmill(wm);
  }
  ball.angle += ball.vx/ball.r * 0.9;            // 굴러가는 회전
  // 강한 충돌 사운드(쿨다운으로 연속 재생 방지)
  if(dropCooldown>0) dropCooldown--;
  if(impactHit && dropCooldown===0){ playDrop(); dropCooldown=10; }
  // 장애물(가시) 접촉 → 실패
  for(const s of (L.spikes||[])){ if(circleRect(ball,s)){ lose(); return; } }
  // 열쇠 획득
  if(L.key && !hasKey && Math.hypot(ball.x-L.key.x, ball.y-L.key.y) < ball.r+L.key.r+6){
    hasKey=true; setStatus('🔑 열쇠 획득! 이제 골로 가세요.','good');
  }
  // 승패
  const g=L.goal, B=L.bounds;
  if(ball.x>g.x && ball.x<g.x+g.w && ball.y>g.y && ball.y<g.y+g.h){
    if(!L.key || hasKey) win();
  } else if(ball.y-ball.r>B.h+60 || ball.x<-80 || ball.x>B.w+80){ lose(); }
}
function circleRect(b,r){
  const cx=Math.max(r.x,Math.min(b.x,r.x+r.w));
  const cy=Math.max(r.y,Math.min(b.y,r.y+r.h));
  return Math.hypot(b.x-cx,b.y-cy) < b.r*0.85;
}
function win(){ mode='win'; setStatus('🏆 클리어! 골에 도착했어요.','good');
  document.getElementById('next').style.display = li<LEVELS.length-1 ? '' : 'none'; }
function lose(){ mode='lose'; setStatus('💥 실패! ✎ 편집을 눌러 변경하세요.','bad'); }

// ---------- 렌더 ----------
function draw(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.setTransform(scale,0,0,scale,camX,camY);   // 카메라 적용(이후 월드 좌표)

  // 보이는 월드 영역
  const vx0=-camX/scale, vy0=-camY/scale, vx1=(W-camX)/scale, vy1=(H-camY)/scale;
  ctx.strokeStyle='rgba(90,100,160,0.08)'; ctx.lineWidth=1/scale;
  const gx0=Math.floor(vx0/40)*40, gy0=Math.floor(vy0/40)*40;
  for(let x=gx0;x<=vx1;x+=40){ctx.beginPath();ctx.moveTo(x,vy0);ctx.lineTo(x,vy1);ctx.stroke();}
  for(let y=gy0;y<=vy1;y+=40){ctx.beginPath();ctx.moveTo(vx0,y);ctx.lineTo(vx1,y);ctx.stroke();}

  // 지형 발판
  for(const g of L.ledges) drawLedge(g);

  // 장애물
  for(const f of (L.fans||[])) drawFan(f);
  for(const wl of (L.walls||[])) drawWall(wl);
  for(const m of (L.movers||[])) drawMover(m);
  for(const wm of (L.windmills||[])) drawWindmill(wm);
  for(const s of (L.spikes||[])) drawSpikes(s);

  // 골 깃발 (+ 열쇠 잠금 표시)
  drawGoal(L.goal);
  if(L.key && !hasKey){
    ctx.fillStyle='rgba(255,209,102,0.9)'; ctx.font=`bold ${20/scale}px Segoe UI`;
    ctx.textAlign='center'; ctx.textBaseline='bottom';
    ctx.fillText('🔒', L.goal.x+L.goal.w/2, L.goal.y-6);
  }
  // 열쇠
  if(L.key) drawKey(L.key);

  // 플레이어 곡선(발판)
  for(const c of curves) drawCurvePlatform(c.pts);

  // 편집용 제어점/폴리곤
  if(mode==='edit' && showCtrl){
    for(const c of curves) drawControls(c.pts);
  }

  // 시작 지점 표식(발판이 없으므로)
  if(mode==='edit'){
    ctx.strokeStyle='rgba(255,209,102,0.5)'; ctx.lineWidth=2/scale; ctx.setLineDash([4/scale,4/scale]);
    ctx.beginPath(); ctx.arc(L.start.x, L.start.y-BALL_R, BALL_R+6, 0, 7); ctx.stroke(); ctx.setLineDash([]);
  }

  // 공
  drawBall();

  // 오버레이 메시지(화면 고정)
  ctx.setTransform(1,0,0,1,0,0);
  if(mode==='win') overlay('CLEAR!', '#6bffb0', li<LEVELS.length-1?'다음 레벨 버튼을 누르세요':'모든 스테이지 클리어! 🎉');
  if(mode==='lose') overlay('실패', '#ff6b8a', '✎ 편집 버튼으로 변경');
}
function drawFan(f){
  const a=(f.angle||0)*Math.PI/180;
  ctx.save(); ctx.translate(f.x,f.y); ctx.rotate(a);
  // 바람 영역(방향으로 옅어지는 그라데이션)
  const grd=ctx.createLinearGradient(0,0,f.range,0);
  grd.addColorStop(0,'rgba(86,211,255,0.22)'); grd.addColorStop(1,'rgba(86,211,255,0)');
  ctx.fillStyle=grd; ctx.fillRect(0,-f.width/2,f.range,f.width);
  // 흘러가는 바람 화살표
  ctx.strokeStyle='rgba(190,235,255,0.55)'; ctx.lineWidth=2/scale; ctx.lineCap='round';
  for(let i=0;i<4;i++){
    const off=((tick*3.5 + i*f.range/4) % f.range);
    ctx.beginPath();
    ctx.moveTo(off,-f.width*0.24); ctx.lineTo(off+16,0); ctx.lineTo(off,f.width*0.24);
    ctx.stroke();
  }
  // 선풍기 본체(방향을 향한 하우징)
  ctx.fillStyle='#2b335c'; ctx.beginPath(); ctx.arc(0,0,22,0,7); ctx.fill();
  ctx.strokeStyle='#56d3ff'; ctx.lineWidth=3; ctx.stroke();
  ctx.fillStyle='#3c477a'; ctx.beginPath(); ctx.moveTo(20,-14); ctx.lineTo(32,0); ctx.lineTo(20,14); ctx.closePath(); ctx.fill();
  // 회전 날개(시각용)
  ctx.rotate(tick*0.35);
  ctx.fillStyle='#8fb6ff';
  for(let b=0;b<4;b++){ ctx.rotate(Math.PI/2); ctx.beginPath(); ctx.ellipse(10,0,10,4.5,0,0,7); ctx.fill(); }
  ctx.fillStyle='#ffd166'; ctx.beginPath(); ctx.arc(0,0,4,0,7); ctx.fill();
  ctx.restore();
}
function drawMover(m){
  const r=moverRect(m);
  // 이동 범위 표시
  ctx.fillStyle='rgba(122,74,95,0.12)';
  if(m.axis==='x') roundRect(m.x-m.amp, m.y, m.w+2*m.amp, m.h, 6);
  else roundRect(m.x, m.y-m.amp, m.w, m.h+2*m.amp, 6);
  ctx.fill();
  // 벽 본체(움직임을 알리는 붉은 톤)
  ctx.fillStyle='#7a4a5f'; roundRect(r.x,r.y,r.w,r.h,5); ctx.fill();
  ctx.fillStyle='#9c5f78'; roundRect(r.x,r.y,r.w,6,4); ctx.fill();
  // 이동 축 화살표
  ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=2/scale;
  const cx=r.x+r.w/2, cy=r.y+r.h/2, a=8;
  ctx.beginPath();
  if(m.axis==='x'){ ctx.moveTo(cx-a,cy-a);ctx.lineTo(cx-a-6,cy);ctx.lineTo(cx-a,cy+a);
    ctx.moveTo(cx+a,cy-a);ctx.lineTo(cx+a+6,cy);ctx.lineTo(cx+a,cy+a); }
  else { ctx.moveTo(cx-a,cy-a);ctx.lineTo(cx,cy-a-6);ctx.lineTo(cx+a,cy-a);
    ctx.moveTo(cx-a,cy+a);ctx.lineTo(cx,cy+a+6);ctx.lineTo(cx+a,cy+a); }
  ctx.stroke();
}
function drawLedge(g){
  ctx.fillStyle='#2b335c';
  roundRect(g.x,g.y,g.w,22,6); ctx.fill();
  ctx.fillStyle='#3c477a'; roundRect(g.x,g.y,g.w,6,4); ctx.fill();
}
function drawGoal(g){
  const fx=g.x+g.w-24, fy=g.y-4;
  ctx.strokeStyle='#cfd6ff'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(fx,fy); ctx.lineTo(fx,fy-54); ctx.stroke();
  ctx.fillStyle='#6bffb0'; ctx.beginPath();
  ctx.moveTo(fx,fy-54); ctx.lineTo(fx-34,fy-44); ctx.lineTo(fx,fy-34); ctx.closePath(); ctx.fill();
  // 도달 영역 힌트
  ctx.strokeStyle='rgba(107,255,176,0.35)'; ctx.setLineDash([5,5]); ctx.lineWidth=1.5;
  roundRect(g.x,g.y,g.w,g.h,8); ctx.stroke(); ctx.setLineDash([]);
}
function drawCurvePlatform(p){
  ctx.strokeStyle='#56d3ff'; ctx.lineWidth=9; ctx.lineCap='round';
  ctx.shadowColor='#56d3ff'; ctx.shadowBlur=10;
  ctx.beginPath();
  for(let i=0;i<=40;i++){ const q=bez(p,i/40); i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y); }
  ctx.stroke(); ctx.shadowBlur=0;
}
function drawControls(p){
  ctx.strokeStyle='rgba(143,155,208,0.5)'; ctx.lineWidth=1.5/scale; ctx.setLineDash([6/scale,6/scale]);
  ctx.beginPath(); p.forEach((q,i)=>i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)); ctx.stroke(); ctx.setLineDash([]);
  p.forEach((q,i)=>{
    const end=(i===0||i===3);
    ctx.fillStyle=end?'#ffd166':'#ff7ac6';
    ctx.save(); ctx.shadowColor=ctx.fillStyle; ctx.shadowBlur=10/scale;
    ctx.beginPath(); ctx.arc(q.x,q.y,8/scale,0,7); ctx.fill(); ctx.restore();
  });
}
function drawWall(w){
  ctx.fillStyle='#4a3a5c'; roundRect(w.x,w.y,w.w,w.h,5); ctx.fill();
  ctx.fillStyle='#5c4a72'; roundRect(w.x,w.y,w.w,6,4); ctx.fill();
}
function drawSpikes(s){
  const n=Math.max(1,Math.round(s.w/16)), tw=s.w/n;
  ctx.fillStyle='#ff6b8a';
  for(let i=0;i<n;i++){
    const x=s.x+i*tw;
    ctx.beginPath(); ctx.moveTo(x,s.y+s.h); ctx.lineTo(x+tw/2,s.y); ctx.lineTo(x+tw,s.y+s.h); ctx.closePath(); ctx.fill();
  }
}
function drawWindmill(wm){
  const base=tick*wm.speed+(wm.phase||0);
  // 회전 반경 표시
  ctx.strokeStyle='rgba(86,211,255,0.15)'; ctx.lineWidth=1.5/scale;
  ctx.beginPath(); ctx.arc(wm.x,wm.y,wm.r,0,7); ctx.stroke();
  // 날개(범퍼 — 시안색)
  ctx.save(); ctx.translate(wm.x,wm.y); ctx.rotate(base);
  ctx.strokeStyle='#56d3ff'; ctx.lineWidth=(wm.thick||6)*2; ctx.lineCap='round';
  ctx.shadowColor='#56d3ff'; ctx.shadowBlur=10;
  for(let b=0;b<wm.blades;b++){
    const a=b*(Math.PI*2/wm.blades);
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(a)*wm.r, Math.sin(a)*wm.r); ctx.stroke();
  }
  ctx.restore();
  // 허브
  ctx.fillStyle='#ffd166'; ctx.beginPath(); ctx.arc(wm.x,wm.y,8,0,7); ctx.fill();
  ctx.strokeStyle='#a9791f'; ctx.lineWidth=2/scale; ctx.stroke();
}
function drawKey(k){
  if(hasKey) return;
  // 반짝이는 링
  ctx.strokeStyle='rgba(255,209,102,0.4)'; ctx.lineWidth=2/scale;
  ctx.beginPath(); ctx.arc(k.x,k.y,k.r+6,0,7); ctx.stroke();
  ctx.save(); ctx.translate(k.x,k.y);
  ctx.shadowColor='#ffd166'; ctx.shadowBlur=12;
  ctx.fillStyle='#ffd166'; ctx.strokeStyle='#a9791f'; ctx.lineWidth=3;
  // 머리(고리)
  ctx.beginPath(); ctx.arc(0,-k.r*0.45,k.r*0.5,0,7); ctx.fill(); ctx.stroke();
  ctx.shadowBlur=0;
  ctx.fillStyle='#1a1f35'; ctx.beginPath(); ctx.arc(0,-k.r*0.45,k.r*0.2,0,7); ctx.fill();
  // 몸통 + 이빨
  ctx.fillStyle='#ffd166';
  ctx.fillRect(-3, k.r*0.05, 6, k.r*0.95);
  ctx.fillRect(-3, k.r*0.75, 12, 5);
  ctx.fillRect(-3, k.r*0.95, 9, 5);
  ctx.restore();
}
function drawBall(){
  ctx.save();
  ctx.translate(ball.x,ball.y);
  ctx.shadowColor='#ffd166'; ctx.shadowBlur=16;
  ctx.fillStyle='#ffd166'; ctx.beginPath(); ctx.arc(0,0,ball.r,0,7); ctx.fill();
  ctx.shadowBlur=0;
  ctx.rotate(ball.angle||0);                     // 회전이 보이도록 십자 무늬
  ctx.strokeStyle='#a9791f'; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.moveTo(-ball.r*0.72,0); ctx.lineTo(ball.r*0.72,0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,-ball.r*0.72); ctx.lineTo(0,ball.r*0.72); ctx.stroke();
  ctx.restore();
}
function overlay(text,color,sub){
  ctx.fillStyle='rgba(10,12,24,0.55)'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle=color; ctx.font='bold 56px Segoe UI'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(text, W/2, H/2-14);
  if(sub){ ctx.fillStyle='#e8ecff'; ctx.font='18px Segoe UI'; ctx.fillText(sub, W/2, H/2+34); }
}
function roundRect(x,y,w,h,r){ ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

// ---------- 입력 ----------
// 클라이언트 → 캔버스 픽셀
function screenPx(e){
  const r=cv.getBoundingClientRect();
  const src=(e.touches&&e.touches[0])||(e.changedTouches&&e.changedTouches[0])||e;
  return { x:(src.clientX-r.left)*(W/r.width), y:(src.clientY-r.top)*(H/r.height) };
}
// 캔버스 픽셀 → 월드 좌표(카메라 반영)
function toWorld(px){ return { x:(px.x-camX)/scale, y:(px.y-camY)/scale }; }
function canvasPos(e){ return toWorld(screenPx(e)); }

function hitCtrl(pos){
  for(let c=0;c<curves.length;c++)
    for(let i=0;i<4;i++){
      const q=curves[c].pts[i];
      if(Math.hypot(q.x-pos.x,q.y-pos.y)<16/scale) return {c,i};
    }
  return null;
}
function moveCtrl(e){
  const p=canvasPos(e), q=curves[dragIdx.c].pts[dragIdx.i];
  q.x=p.x; q.y=p.y; markEdited(); refreshInk(); draw();
}

cv.addEventListener('mousedown',e=>{
  if(e.button===2){ panning=true; panLast=screenPx(e); e.preventDefault(); return; }  // 우클릭=화면 이동
  if(mode!=='edit') return;
  dragIdx=hitCtrl(canvasPos(e)); draw();
});
window.addEventListener('mousemove',e=>{
  if(panning){ const p=screenPx(e); camX+=p.x-panLast.x; camY+=p.y-panLast.y; panLast=p; draw(); return; }
  if(dragIdx) moveCtrl(e);
});
window.addEventListener('mouseup',()=>{ panning=false; dragIdx=null; });

cv.addEventListener('touchstart',e=>{
  if(mode!=='edit')return; e.preventDefault(); dragIdx=hitCtrl(canvasPos(e)); draw();
},{passive:false});
cv.addEventListener('touchmove',e=>{ if(!dragIdx)return; e.preventDefault(); moveCtrl(e); },{passive:false});
cv.addEventListener('touchend',()=>{ dragIdx=null; });

// 우클릭 메뉴 차단(화면 이동용)
cv.addEventListener('contextmenu',e=>e.preventDefault());

// 더블클릭으로 곡선 삭제
cv.addEventListener('dblclick',e=>{
  if(mode!=='edit') return;
  const h=hitCtrl(canvasPos(e));
  if(h){ curves.splice(h.c,1); markEdited(); refreshInk(); draw(); }
});

// 마우스 휠로 커서 기준 확대/축소
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  const px=screenPx(e), w=toWorld(px);
  const f=e.deltaY<0?1.1:1/1.1;
  scale=Math.min(4,Math.max(0.15,scale*f));
  camX=px.x-w.x*scale; camY=px.y-w.y*scale;
  draw();
},{passive:false});

// ---------- 곡선 추가(패널에서 드래그) ----------
const spawn=document.getElementById('spawn');
let ghost=null, spawning=false;
function moveGhost(e){ const s=(e.touches&&e.touches[0])||e; ghost.style.left=s.clientX+'px'; ghost.style.top=s.clientY+'px'; }
function startSpawn(e){ if(mode!=='edit')return; e.preventDefault(); spawning=true;
  ghost=document.createElement('div'); ghost.className='ghost'; document.body.appendChild(ghost); moveGhost(e); }
function onSpawnMove(e){ if(!spawning)return; e.preventDefault(); moveGhost(e); }
function onSpawnUp(e){
  if(!spawning)return; spawning=false;
  const s=(e.changedTouches&&e.changedTouches[0])||e;
  const r=cv.getBoundingClientRect();
  if(s.clientX>=r.left&&s.clientX<=r.right&&s.clientY>=r.top&&s.clientY<=r.bottom){
    const p=canvasPos(e);
    // 드롭 지점을 중심으로 가로로 놓인 기본 곡선
    curves.push({pts:[
      {x:p.x-120,y:p.y}, {x:p.x-40,y:p.y-40}, {x:p.x+40,y:p.y+40}, {x:p.x+120,y:p.y}
    ]});
    markEdited(); refreshInk(); draw();
  }
  if(ghost){ ghost.remove(); ghost=null; }
}
spawn.addEventListener('mousedown',startSpawn);
window.addEventListener('mousemove',onSpawnMove);
window.addEventListener('mouseup',onSpawnUp);
spawn.addEventListener('touchstart',startSpawn,{passive:false});
window.addEventListener('touchmove',onSpawnMove,{passive:false});
window.addEventListener('touchend',onSpawnUp);

// ---------- 잉크/상태 ----------
function refreshInk(){
  const used=totalInk(), max=L.inkMax;
  const pct=Math.min(100, used/max*100);
  document.getElementById('inkbar').style.width=pct+'%';
  const over=used>max;
  document.getElementById('inkbar').style.filter = over?'grayscale(1) brightness(1.4)':'none';
  const st=document.getElementById('inkstat');
  st.innerHTML=`<b style="color:${over?'#ff6b8a':'#e8ecff'}">${Math.round(used)}</b> / ${max}${over?' — 초과!':''}`;
}
function setStatus(msg,kind){
  const el=document.getElementById('status');
  el.textContent=msg;
  el.style.color = kind==='good'?'#6bffb0':kind==='bad'?'#ff6b8a':'#8f9bd0';
}

// ---------- 버튼 ----------
document.getElementById('go').addEventListener('click',()=>{
  if(totalInk()>L.inkMax){ setStatus('잉크가 초과됐어요. 곡선을 줄이세요.','bad'); return; }
  resetBall(); buildSegs(); mode='play'; setStatus('굴러가는 중…');
});
function backToEdit(){
  mode='edit'; resetBall();
  setStatus(`${li+1}/${LEVELS.length} · ${L.name} — 곡선을 조절하세요.`);
  document.getElementById('next').style.display='none';
  draw();
}
document.getElementById('clear').addEventListener('click',()=>{
  if(mode!=='edit')return; curves=[]; markEdited(); refreshInk(); draw();
});
document.getElementById('next').addEventListener('click',()=>{
  if(li<LEVELS.length-1) loadLevel(li+1);
});
document.getElementById('edit').addEventListener('click',backToEdit);
document.getElementById('showCtrl').addEventListener('change',e=>{ showCtrl=e.target.checked; draw(); });
window.addEventListener('keydown',e=>{ if(e.key==='f'||e.key==='F'){ fitView(); draw(); } });

// ---------- 루프 ----------
function loop(){
  tick++;
  if(mode==='play'){
    physicsStep();
    // 공을 부드럽게 따라가는 카메라(줌 배율은 유지)
    const tx=W/2-ball.x*scale, ty=H/2-ball.y*scale;
    camX+=(tx-camX)*0.09; camY+=(ty-camY)*0.09;
  }
  draw();
  requestAnimationFrame(loop);
}
loadLevel(0);
loop();

const originalWin=win;
win=function(){
  finishStage();
  originalWin();
  if(li===LEVELS.length-1){
    const score=finalScore();
    document.getElementById('scorestat').textContent=`최종 점수: ${score.toLocaleString()} (남은 잉크 ${Math.round(remainingInkScore)}, 연속 보너스 x${scoreMultiplier().toFixed(1)})`;
    submitRanking(score);
  }
};
const originalLose=lose;
lose=function(){ clearStreak=0; originalLose(); };
const originalLoadLevel=loadLevel;
loadLevel=function(index){ originalLoadLevel(index); stageEdited=false; };
document.getElementById('go').addEventListener('click',()=>{
  if(mode!=='play') return;
  if(li===0){
    const editedBeforeStart=stageEdited;
    resetScoreRun();
    stageEdited=editedBeforeStart;
  }
});
</script>
</body>
